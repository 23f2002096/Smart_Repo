{% extends "base.html" %}

{% block title %}
Repository Explorer
{% endblock %}

{% block content %}

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">

        <a href="{{ url_for('dashboard.dashboard') }}"
        class="btn btn-outline-secondary">

            ← Back to Dashboard

        </a>

        <h4 class="mb-0">
            📁 Repository Explorer
        </h4>

    </div>

    <hr>

    <table class="table table-striped">

        <thead>

            <tr>

                <th>#</th>

                <th>File</th>

                <th>Size</th>

            </tr>

        </thead>

        <tbody>

        {% for file in repository.files %}

            <tr>

                <td>{{ loop.index }}</td>

                <td>

                    <a href="{{ url_for('repository.file_details', file_index=loop.index0) }}">

                        {{ file.file.relative_path }}

                    </a>

                </td>

                <td>{{ file.file.size }} bytes</td>

            </tr>

        {% endfor %}

        </tbody>

    </table>

</div>

{% endblock %}
