{% extends "base.html" %}

{% block title %}
Repository Explorer
{% endblock %}

{% block content %}

<div class="container mt-4">

    <h2>Repository Explorer</h2>

    <hr>

    <table class="table table-striped">

        <thead>

            <tr>

                <th>#</th>

                <th>File</th>

                <th>Size</th>

            </tr>

        </thead>

        <tbody>

        {% for file in repository.files %}

            <tr>

                <td>{{ loop.index }}</td>

                <td>{{ file.file.relative_path }}</td>

                <td>{{ file.file.size }} bytes</td>

            </tr>

        {% endfor %}

        </tbody>

    </table>

</div>

{% endblock %}
